    <line x1="255" y1="380" x2="255" y2="235"/>
    <line x1="405" y1="380" x2="405" y2="530"/>
    <line x1="765" y1="380" x2="765" y2="235"/>
    <line x1="915" y1="380" x2="915" y2="530"/>
