    <path class="r" opacity=".55" d="M890 380a25 25 0 0 0 50 0"/><path class="r" opacity=".4" d="M870 380a45 45 0 0 0 90 0"/><path class="r" opacity=".28" d="M850 380a65 65 0 0 0 130 0"/><path class="r" opacity=".16" d="M830 380a85 85 0 0 0 170 0"/>
